    <linearGradient id="paper" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#B0F5DB"/><stop offset="1" stop-color="#48C7A5"/></linearGradient>
  </defs>
  <!-- dark panel so the wordmark reads on light and dark READMEs -->
  <rect x="0" y="0" width="800" height="256" rx="40" ry="40" fill="#101827"/>
  <!-- logo mark (same geometry as logo.svg, scaled to half size) -->
