    <path d="M279 103V174Q279 195 300 195H371Z" fill="#268F81"/>
    <path d="M298 228V252M286 240H310" stroke="#173B42" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- wordmark and slogan -->
  <text x="284" y="134" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="96" font-weight="700" fill="#F8FAFC">IdleStow</text>
  <text x="288" y="186" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="30" font-weight="400" fill="#6EE7C4">Idle files. Reclaimed space.</text>
