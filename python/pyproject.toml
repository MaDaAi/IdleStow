[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idlestow"
version = "0.1.0"
description = "IdleStow optimization worker (compression, verification, estimation) driven by the Java host over stdin/stdout."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
zstd = ["zstandard==0.25.0"]
monitor = ["psutil==7.2.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["idlestow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607", "S311"]
"idlestow/fixtures.py" = ["S311"]
"idlestow/benchmarking/*" = ["S311", "S603"]
